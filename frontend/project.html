<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Novel Assistant - 创作工作台</title>
    <link rel="stylesheet" href="./static/style.css" />
  </head>
  <body data-page="project">
    <div class="workspace-shell">
      <header class="workspace-topbar">
        <div>
          <a href="./index.html" class="back-link">← 返回书架</a>
          <h1 id="project-title-heading">作品名称</h1>
          <p class="topbar-subtitle">极简正文写作与思路整合</p>
        </div>
      </header>

      <main class="workspace-content">
        <article class="paper-card">
          <nav class="module-nav simple-tabs" id="main-tabs">
            <button class="module-item active" data-tab="chapters">章节正文</button>
            <button class="module-item" data-tab="notes">创作档案</button>
          </nav>
        </article>

        <section id="tab-chapters" class="paper-card">
          <div class="module-head">
            <h2>正文创作区</h2>
          </div>
          <div class="writing-layout">
            <aside class="writing-sidebar">
              <div class="module-head">
                <h3>章节目录</h3>
                <button id="add-chapter-btn" class="btn btn-secondary">新增章节</button>
              </div>
              <div id="chapter-list" class="chapter-list"></div>
            </aside>
            <section class="writing-editor">
              <div class="module-head">
                <input id="chapter-title-input" type="text" placeholder="章节标题" />
                <div class="inline-actions">
                  <button id="save-chapter-btn" class="btn btn-primary">保存章节</button>
                  <button id="delete-chapter-btn" class="btn btn-danger">删除章节</button>
                </div>
              </div>
              <textarea id="chapter-content-input" class="notebook-textarea" rows="24" placeholder="在这里书写本章正文..." ></textarea>
            </section>
          </div>
        </section>

        <section id="tab-notes" class="paper-card hidden">
          <div class="module-head">
            <h2>档案管理区</h2>
          </div>
          <div class="notes-mode-switch hidden" id="notes-mode-switch">
            <button class="module-item active" data-notes-mode="list">档案目录</button>
            <button class="module-item" data-notes-mode="editor">内容编辑</button>
          </div>
          <div class="notes-layout">
            <aside class="notes-types" id="notes-list-side">
              <button class="module-item active" data-note-type="character">人物</button>
              <button class="module-item" data-note-type="foreshadow">伏笔</button>
              <button class="module-item" data-note-type="plotline">情节线</button>
              <button class="module-item" data-note-type="other">世界观</button>
            </aside>
            <section class="notes-list-pane" id="notes-list-pane">
              <div class="module-head">
                <h3 id="note-list-title">人物档案</h3>
                <button id="add-note-btn" class="btn btn-secondary">新增档案</button>
              </div>
              <div id="note-list" class="chapter-list"></div>
            </section>
            <section class="notes-editor" id="notes-editor-pane">
              <div class="module-head">
                <input id="note-title-input" type="text" placeholder="档案标题" />
                <div class="inline-actions">
                  <select id="note-type-input" class="hidden">
                    <option value="character">人物</option>
                    <option value="foreshadow">伏笔</option>
                    <option value="plotline">情节线</option>
                    <option value="other">世界观</option>
                  </select>
                  <button id="save-note-btn" class="btn btn-primary">保存档案</button>
                  <button id="delete-note-btn" class="btn btn-danger">删除档案</button>
                </div>
              </div>
              <textarea id="note-content-input" class="notebook-textarea" rows="24" placeholder="在这里自由记录你的创作档案..." ></textarea>
            </section>
          </div>
        </section>

        <p id="save-message" class="save-message"></p>
        <p id="meta-info" class="meta-line"></p>
      </main>
    </div>

    <script src="./static/app.js"></script>
  </body>
</html>
