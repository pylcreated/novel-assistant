<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>作品相关</title>
    <link rel="stylesheet" href="./static/style.css">
  </head>
  <body>
    <main class="workspace page-wrap sketch-page">
      <header class="sketch-topbar">
        <a id="back-link" class="sketch-back" href="#" aria-label="返回">↶</a>
        <div class="related-title-block">
          <p id="project-name" class="eyebrow">作品</p>
          <h1 id="related-title">作品相关</h1>
        </div>
        <span></span>
      </header>

      <section id="collection-list" class="collection-list" aria-label="作品相关集合"></section>
    </main>

    <div id="create-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="create-modal-title">
      <section class="modal-card">
        <h2 id="create-modal-title">新建条目</h2>
        <label class="field">
          <span id="create-modal-label">名称</span>
          <input id="create-modal-input" type="text" autocomplete="off">
        </label>
        <p id="create-modal-status" class="save-state"></p>
        <div class="actions">
          <button id="create-modal-confirm" class="button primary" type="button">创建</button>
          <button id="create-modal-cancel" class="button ghost" type="button">取消</button>
        </div>
      </section>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./static/api.js"></script>
    <script src="./static/ui.js"></script>
    <script src="./static/related.js"></script>
  </body>
</html>
