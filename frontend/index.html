<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Novel Assistant - 项目首页</title>
    <link rel="stylesheet" href="./static/style.css" />
  </head>
  <body data-page="index">
    <main class="index-shell">
      <header class="index-header">
        <div>
          <h1>Novel Assistant</h1>
          <p class="subtitle">小说创作工作台 · 项目入口</p>
        </div>
      </header>

      <div class="index-layout">
        <section class="index-panel">
          <h2>创建新项目</h2>
          <form id="create-project-form" class="index-form">
            <label for="title">小说标题</label>
            <input id="title" name="title" type="text" required maxlength="100" />

            <label for="description">小说简介</label>
            <textarea id="description" name="description" rows="5" placeholder="可选"></textarea>

            <button type="submit" class="btn btn-primary">创建项目</button>
          </form>
          <p id="create-message" class="message"></p>
        </section>

        <section class="index-panel">
          <div class="module-head">
            <h2>项目列表</h2>
            <button id="refresh-projects-btn" type="button" class="btn btn-secondary">刷新</button>
          </div>
          <div id="project-list" class="project-cards"></div>
        </section>
      </div>
    </main>

    <script src="./static/index.js"></script>
  </body>
</html>
