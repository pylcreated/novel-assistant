<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>尽情落笔吧！</title>
    <link rel="stylesheet" href="./static/style.css">
  </head>
  <body>
    <div class="app-shell home-shell">
      <aside class="home-sidebar">
      </aside>

      <main class="workspace">
        <header class="page-heading home-heading">
          <div>
            <p class="eyebrow">Novel Workspace</p>
            <h2>尽情落笔吧！</h2>
          </div>
          <button id="new-project-button" class="home-add-button" type="button" aria-label="新建作品">+</button>
        </header>

        <section id="new-project-panel" class="soft-panel hidden" aria-label="新建作品">
          <label class="field">
            <span>作品名</span>
            <input id="project-title" type="text" autocomplete="off" placeholder="例如：长夜来信">
          </label>
          <label class="field">
            <span>简介</span>
            <textarea id="project-description" rows="4" placeholder="一句话或一小段都可以"></textarea>
          </label>
          <div class="actions">
            <button id="create-project-button" class="button primary" type="button">创建作品</button>
            <button id="cancel-project-button" class="button ghost" type="button">取消</button>
          </div>
        </section>

        <section>
          <div id="project-list" class="project-grid"></div>
          <p id="empty-state" class="empty hidden">还没有作品。先写下第一个名字吧。</p>
        </section>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./static/api.js"></script>
    <script src="./static/ui.js"></script>
    <script src="./static/index.js"></script>
  </body>
</html>
